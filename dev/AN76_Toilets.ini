; DEV ONLY - staged into AN76Toilets-dev, never packaged. The game reads Data\<plugin>.ini for a
; loaded plugin, so this turns Papyrus logging on while the dev copy is installed:
; Documents\My Games\Fallout4\Logs\Script\Papyrus.0.log ("AN76 Toilets:" lines).
[Papyrus]
bEnableLogging=1
bEnableTrace=1
bLoadDebugInformation=1
